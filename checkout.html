<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | SOLEVERSE</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("soleverseTheme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html">SOLEVERSE</a
      ><button class="menu-btn" onclick="toggleMenu()">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a><a href="sneakers.html">Sneakers</a
        ><a href="sneakers.html?filter=new">New Arrivals</a
        ><a href="sneakers.html?filter=sale">Sale</a
        ><a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="favorites.html"
          >♡ Favorites (<span class="fav-count">0</span>)</a
        >
        <a href="checkout.html">Cart (<span class="cart-count">0</span>)</a
        ><button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()"
          aria-label="Switch theme"
          title="Switch theme"
        >
          <span class="theme-toggle-icon">☀</span
          ><span class="theme-toggle-text">Light</span>
        </button>
      </div>
    </header>
    <main class="container">
      <section class="form-layout">
        <form class="card form-card" onsubmit="placeOrder(event)">
          <h2>Checkout</h2>
          <div class="eyebrow">Contact</div>
          <div class="field">
            <label>Email</label
            ><input required type="email" placeholder="Email address" />
          </div>
          <div class="field">
            <label>Phone</label
            ><input required type="tel" placeholder="+92 3XX XXXXXXX" />
          </div>
          <div class="eyebrow">Delivery</div>
          <div class="field">
            <label>Full name</label><input required placeholder="Full name" />
          </div>
          <div class="field">
            <label>City</label
            ><select required>
              <option value="">Select city</option>
              <option>Karachi</option>
              <option>Lahore</option>
              <option>Islamabad</option>
              <option>Rawalpindi</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label>Address</label
            ><textarea
              required
              rows="3"
              placeholder="House, street, area"
            ></textarea>
          </div>
          <div class="eyebrow">Payment</div>
          <div class="field">
            <label>Payment method</label
            ><select required>
              <option value="">Choose payment method</option>
              <option>Cash on Delivery</option>
              <option>Bank Transfer</option>
              <option>Card Payment</option>
            </select>
          </div>
          <button class="btn" type="submit">Place order</button>
        </form>
        <aside class="card order-summary">
          <div class="eyebrow">Order summary</div>
          <div id="checkoutItems"></div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row" style="font-size: 18px">
            <strong>Total</strong><strong id="checkoutTotal">Rs. 0</strong>
          </div>
          <a
            class="btn-outline"
            href="sneakers.html"
            style="width: 100%; margin-top: 18px"
            >Continue shopping</a
          >
        </aside>
      </section>
    </main>
    <footer class="footer container">
      <span>© 2026 SOLEVERSE · Karachi, Pakistan</span
      ><span>info@soleverse.com · +92 300 1234567</span>
      <div class="footer-links">
        <a href="index.html">Home</a><a href="sneakers.html">Shop</a
        ><a href="contact.html">Contact</a>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
