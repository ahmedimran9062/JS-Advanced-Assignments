<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-text">
        <p></p>
        <h1>THINGS <br />TO DO.</h1>
      </div>
      <section class="button-section">
        <button class="btn themeBtn">light mode</button>
      </section>
    </header>
    <main class="container">
      <section class="form-section">
        <form id="form" action="">
          <h2>NEW TASK</h2>
          <div class="input-container">
            <label class="form-label title-label" for="title"
              >TITLE <span class="req" hidden>TITLE REQUIRED.</span></label
            >
            <input
              type="text"
              name="title"
              id="title"
              class="form-input"
              placeholder="eg. Finish school project"
            />
          </div>
          <div class="input-container">
            <label class="form-label" for="date">DATE</label>
            <input type="date" name="date" id="date" class="form-input" />
          </div>
          <button class="btn submitBtn">add task</button>
        </form>
      </section>
      <section class="list-section">
        <div id="empty-text">
          <p>NOTHING HERE YET</p>
        </div>
        <div id="whole-list" class="hidden">
          <h2>YOUR LIST</h2>
          <div class="search-container">
            <label class="search-label" for="search">SEARCH</label>
            <input
              type="text"
              id="search"
              name="search"
              oninput="updateList()"
            />
          </div>
          <div class="filter-container">
            <div class="filter-sort">
              <label for="sort">SORT BY</label>
              <select onchange="updateList()" name="sort" id="sort">
                <option value="soonest">Due date: soonest</option>
                <option value="latest">Due date: latest</option>
                <option value="newest">Date :Newest added</option>
                <option value="oldest">Date: Oldest added</option>

                <option value="atoz">Title: A to Z</option>
                <option value="ztoa">Title: Z to A</option>
              </select>
            </div>

            <div class="filter-btns">
              <button class="btn active" data-filter="all">All</button>
              <button class="btn" data-filter="pending">pending</button>
              <button class="btn" data-filter="completed">completed</button>
            </div>
          </div>
          <p class="task-count"></p>
        </div>
        <ul class="list-container"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
