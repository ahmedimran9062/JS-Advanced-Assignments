<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites | SOLEVERSE</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("soleverseTheme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html">SOLEVERSE</a>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="sneakers.html">Sneakers</a>
        <a href="sneakers.html?filter=new">New Arrivals</a>
        <a href="sneakers.html?filter=sale">Sale</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="favorites.html"
          >♡ Favorites (<span class="fav-count">0</span>)</a
        >
        <a href="checkout.html">Cart (<span class="cart-count">0</span>)</a>
        <button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()"
          aria-label="Switch theme"
          title="Switch theme"
        >
          <span class="theme-toggle-icon">☀</span
          ><span class="theme-toggle-text">Light</span>
        </button>
      </div>
    </header>
    <main>
      <section class="container shop-top">
        <div class="eyebrow">Your saved pairs</div>
        <h1>Favorites</h1>
        <p id="favCount" class="muted"></p>
        <div class="shop-grid" id="favGrid"></div>
      </section>
    </main>
    <footer class="footer container">
      <span>© 2026 SOLEVERSE · Karachi, Pakistan</span>
      <span>info@soleverse.com · +92 300 1234567</span>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="sneakers.html">Shop</a>
        <a href="contact.html">Contact</a>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
