<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers | SOLEVERSE</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("soleverseTheme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html">SOLEVERSE</a
      ><button class="menu-btn" onclick="toggleMenu()">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a><a href="sneakers.html">Sneakers</a
        ><a href="sneakers.html?filter=new">New Arrivals</a
        ><a href="sneakers.html?filter=sale">Sale</a
        ><a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="favorites.html"
          >♡ Favorites (<span class="fav-count">0</span>)</a
        >
        <a href="checkout.html">Cart (<span class="cart-count">0</span>)</a
        ><button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()"
          aria-label="Switch theme"
          title="Switch theme"
        >
          <span class="theme-toggle-icon">☀</span
          ><span class="theme-toggle-text">Light</span>
        </button>
      </div>
    </header>
    <main>
      <section class="container shop-top">
        <div class="eyebrow">The collection</div>
        <h1 id="shopTitle">Sneakers</h1>
        <p id="shopBlurb">
          Explore everyday essentials, performance favourites and the latest
          drops.
        </p>
        <div class="tabs">
          <a id="pill-all" class="pill" href="sneakers.html">All sneakers</a
          ><a id="pill-new" class="pill" href="sneakers.html?filter=new"
            >New arrivals</a
          ><a id="pill-sale" class="pill" href="sneakers.html?filter=sale"
            >Sale</a
          >
        </div>
        <div class="card filters">
          <div class="field">
            <label for="searchInput">SEARCH SNEAKERS</label
            ><input
              id="searchInput"
              type="search"
              placeholder="Search by name..."
              oninput="filterProducts()"
            />
          </div>
          <div class="field">
            <label for="typeFilter">SHOE TYPE</label
            ><select id="typeFilter" onchange="filterProducts()">
              <option value="">All types</option>
              <option>Running</option>
              <option>Casual</option>
              <option>Sport</option>
            </select>
          </div>
          <div class="field">
            <label for="priceFilter">PRICE RANGE</label
            ><select id="priceFilter" onchange="filterProducts()">
              <option value="">All prices</option>
              <option value="0-11000">Under Rs. 11,000</option>
              <option value="11000-14000">Rs. 11,000–14,000</option>
              <option value="14000-999999">Above Rs. 14,000</option>
            </select>
          </div>
          <div class="field">
            <label for="sortFilter">SORT BY</label
            ><select id="sortFilter" onchange="filterProducts()">
              <option value="featured">Featured</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>
        <div
          class="mono muted"
          id="resultCount"
          style="font-size: 12px; margin: 0 0 15px"
        ></div>
        <div class="shop-grid" id="shopGrid"></div>
      </section>
    </main>
    <footer class="footer container">
      <span>© 2026 SOLEVERSE · Karachi, Pakistan</span
      ><span>info@soleverse.com · +92 300 1234567</span>
      <div class="footer-links">
        <a href="index.html">Home</a><a href="sneakers.html">Shop</a
        ><a href="contact.html">Contact</a>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
<!---->
